# NATS Server Configuration
server_name: "tav-nats"

# Listen for client connections
listen: 0.0.0.0:4222

# HTTP monitoring port
http_port: 8222

# JetStream Configuration
jetstream {
  # Store directory for JetStream data
  store_dir: "/data/jetstream"

  # Maximum memory and storage
  max_memory_store: 1GB
  max_file_store: 10GB
}

# Logging
debug: false
trace: false
logtime: true
log_file: "/dev/stdout"

# Limits
max_payload: 1MB
max_connections: 1000
max_pending: 100MB
