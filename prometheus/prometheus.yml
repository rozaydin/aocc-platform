global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: 'tav-platform'

# Alertmanager integration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Alert rules
rule_files:
  - '/etc/prometheus/alert-rules.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Container metrics from cAdvisor
  - job_name: 'cadvisor'
    scrape_interval: 15s
    static_configs:
      - targets: ['cadvisor:8080']

  # PostgreSQL metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Alertmanager metrics
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # Garage object storage metrics
  - job_name: 'garage'
    static_configs:
      - targets: ['garage:3903']
    bearer_token: 'clFucTtQN+tAL/SMqXbZJyjraD9Nc/VDg3pA1VKZIGEgnyc5q4U4SztNG0RLagOK'

  # Nuclio dashboard metrics
  - job_name: 'nuclio'
    static_configs:
      - targets: ['nuclio-dashboard:8070']

  # NATS message broker metrics
  - job_name: 'nats'
    static_configs:
      - targets: ['nats:8222']

  # Bento stream processor metrics
  - job_name: 'bento'
    static_configs:
      - targets: ['bento:4195']
