groups:
  - name: container_health
    interval: 30s
    rules:
      - alert: ContainerDown
        expr: absent(container_last_seen)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} is down"
          description: "Container {{ $labels.name }} on {{ $labels.instance }} has been down for more than 2 minutes."

      - alert: HighContainerCPU
        expr: rate(container_cpu_usage_seconds_total{name!=""}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage for container {{ $labels.name }}"
          description: "Container {{ $labels.name }} CPU usage is above 80% (current: {{ $value | humanizePercentage }})"

      - alert: HighContainerMemory
        expr: (container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""}) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage for container {{ $labels.name }}"
          description: "Container {{ $labels.name }} memory usage is above 90% (current: {{ $value | humanizePercentage }})"

  - name: postgres_health
    interval: 30s
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL instance is down"
          description: "PostgreSQL on {{ $labels.instance }} has been down for more than 1 minute."

      - alert: PostgresHighConnections
        expr: sum(pg_stat_activity_count) by (instance) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL has high connection count"
          description: "PostgreSQL on {{ $labels.instance }} has {{ $value }} active connections."

      - alert: PostgresReplicationLag
        expr: pg_replication_lag > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL replication lag detected"
          description: "PostgreSQL replication lag on {{ $labels.instance }} is {{ $value }}s."

      - alert: PostgresDeadlocks
        expr: rate(pg_stat_database_deadlocks[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL deadlocks detected"
          description: "PostgreSQL on {{ $labels.instance }} has deadlocks (rate: {{ $value }}/s)."

  - name: service_availability
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} on {{ $labels.instance }} has been down for more than 2 minutes."

  - name: prometheus_health
    interval: 30s
    rules:
      - alert: PrometheusTargetDown
        expr: up{job="prometheus"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target is down"
          description: "Prometheus scrape target {{ $labels.instance }} has been down for more than 2 minutes."

      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus configuration reload failed"
          description: "Prometheus configuration reload has failed on {{ $labels.instance }}."

      - alert: PrometheusTSDBCompactionsFailed
        expr: rate(prometheus_tsdb_compactions_failed_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus TSDB compactions failing"
          description: "Prometheus TSDB compactions are failing on {{ $labels.instance }}."

      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager is down"
          description: "Alertmanager on {{ $labels.instance }} has been down for more than 2 minutes."

  - name: garage_health
    interval: 30s
    rules:
      - alert: GarageDown
        expr: up{job="garage"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Garage object storage is down"
          description: "Garage on {{ $labels.instance }} has been down for more than 2 minutes."

      - alert: GarageHighDiskUsage
        expr: (garage_block_bytes_written / garage_block_bytes_capacity) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Garage disk usage is high"
          description: "Garage disk usage is above 85% (current: {{ $value | humanizePercentage }})."
