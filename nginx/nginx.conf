worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # ---------- OAuth2-Proxy ----------
        location /oauth2/ {
            proxy_pass http://oauth2-proxy:4180;
            proxy_set_header Host                    $http_host;
            proxy_set_header X-Real-IP               $remote_addr;
            proxy_set_header X-Forwarded-For          $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto        $scheme;
            proxy_buffer_size          128k;
            proxy_buffers            4 256k;
            proxy_busy_buffers_size    256k;
        }

        location = /oauth2/auth {
            internal;
            proxy_pass http://oauth2-proxy:4180;
            proxy_set_header Host             $http_host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Content-Length   "";
            proxy_pass_request_body           off;
        }

        # ---------- Keycloak ----------
        location /keycloak/ {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host                    $http_host;
            proxy_set_header X-Real-IP               $remote_addr;
            proxy_set_header X-Forwarded-For          $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto        $scheme;
            proxy_buffer_size          128k;
            proxy_buffers            4 256k;
            proxy_busy_buffers_size    256k;
        }

        # ---------- Prometheus (protected) ----------
        location /prometheus/ {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/sign_in;

            # pass user identity from oauth2-proxy to upstream
            auth_request_set $user   $upstream_http_x_auth_request_user;
            auth_request_set $email  $upstream_http_x_auth_request_email;
            proxy_set_header X-User  $user;
            proxy_set_header X-Email $email;

            proxy_pass http://prometheus:9090/;
            proxy_set_header Host                    $http_host;
            proxy_set_header X-Real-IP               $remote_addr;
            proxy_set_header X-Forwarded-For          $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto        $scheme;
        }

        # ---------- Alertmanager (protected) ----------
        location /alertmanager/ {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/sign_in;

            # pass user identity from oauth2-proxy to upstream
            auth_request_set $user   $upstream_http_x_auth_request_user;
            auth_request_set $email  $upstream_http_x_auth_request_email;
            proxy_set_header X-User  $user;
            proxy_set_header X-Email $email;

            proxy_pass http://alertmanager:9093/;
            proxy_set_header Host                    $http_host;
            proxy_set_header X-Real-IP               $remote_addr;
            proxy_set_header X-Forwarded-For          $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto        $scheme;
        }

        # ---------- Garage Admin API (protected) ----------
        location /garage/admin/ {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/sign_in;

            # pass user identity from oauth2-proxy to upstream
            auth_request_set $user   $upstream_http_x_auth_request_user;
            auth_request_set $email  $upstream_http_x_auth_request_email;
            proxy_set_header X-User  $user;
            proxy_set_header X-Email $email;

            proxy_pass http://garage:3903/;
            proxy_set_header Host                    $http_host;
            proxy_set_header X-Real-IP               $remote_addr;
            proxy_set_header X-Forwarded-For          $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto        $scheme;
        }

        # ---------- Garage S3 API (no auth - uses S3 credentials) ----------
        location /s3/ {
            proxy_pass http://garage:3900/;
            proxy_set_header Host                    $http_host;
            proxy_set_header X-Real-IP               $remote_addr;
            proxy_set_header X-Forwarded-For          $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto        $scheme;

            # S3 specific settings
            proxy_buffering off;
            client_max_body_size 0;
        }

        # ---------- Grafana (protected) - NOW AT /grafana/ ----------
        location /grafana/ {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/sign_in;

            # pass user identity from oauth2-proxy to upstream
            auth_request_set $user   $upstream_http_x_auth_request_user;
            auth_request_set $email  $upstream_http_x_auth_request_email;
            proxy_set_header X-User  $user;
            proxy_set_header X-Email $email;

            proxy_pass http://grafana:3000;
            proxy_set_header Host                    $http_host;
            proxy_set_header X-Real-IP               $remote_addr;
            proxy_set_header X-Forwarded-For          $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto        $scheme;

            # websocket support for Grafana live
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ---------- Nuclio Functions (example pattern) ----------
        # Add function-specific routes here as needed
        # Example for a function named "hello-world":
        # location /functions/hello-world/ {
        #     proxy_pass http://nuclio-hello-world:8080/;
        #     proxy_set_header Host                    $http_host;
        #     proxy_set_header X-Real-IP               $remote_addr;
        #     proxy_set_header X-Forwarded-For          $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto        $scheme;
        # }

        # ---------- Nuclio API (protected) ----------
        # Must come before root location to match /api/ prefix
        location /api/ {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/sign_in;

            # pass user identity from oauth2-proxy to upstream
            auth_request_set $user   $upstream_http_x_auth_request_user;
            auth_request_set $email  $upstream_http_x_auth_request_email;
            proxy_set_header X-User  $user;
            proxy_set_header X-Email $email;

            proxy_pass http://nuclio-dashboard:8070/api/;
            proxy_set_header Host                    $http_host;
            proxy_set_header X-Real-IP               $remote_addr;
            proxy_set_header X-Forwarded-For          $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto        $scheme;
        }

        # ---------- Nuclio Dashboard (protected) - NOW AT ROOT / ----------
        location / {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/sign_in;

            # pass user identity from oauth2-proxy to upstream
            auth_request_set $user   $upstream_http_x_auth_request_user;
            auth_request_set $email  $upstream_http_x_auth_request_email;
            proxy_set_header X-User  $user;
            proxy_set_header X-Email $email;

            proxy_pass http://nuclio-dashboard:8070;
            proxy_set_header Host                    $http_host;
            proxy_set_header X-Real-IP               $remote_addr;
            proxy_set_header X-Forwarded-For          $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto        $scheme;

            # WebSocket support for dashboard live updates
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
