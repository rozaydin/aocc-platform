global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default-receiver'

  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      continue: true

receivers:
  - name: 'default-receiver'
    # Configure your preferred notification method
    # Email example:
    # email_configs:
    #   - to: 'alerts@example.com'
    #     from: 'alertmanager@tav-platform.local'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: '${SMTP_USERNAME}'
    #     auth_password: '${SMTP_PASSWORD}'
    #
    # Webhook example:
    # webhook_configs:
    #   - url: 'http://webhook-receiver:8080/alerts'
    #
    # Slack example:
    # slack_configs:
    #   - api_url: '${SLACK_WEBHOOK_URL}'
    #     channel: '#alerts'
    #     title: 'TAV Platform Alert'

  - name: 'critical-receiver'
    # Add escalation channels for critical alerts

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'instance']
