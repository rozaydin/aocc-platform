[databases]
tav = host=postgres port=5432 dbname=tav
keycloak = host=postgres port=5432 dbname=keycloak
grafana = host=postgres port=5432 dbname=grafana

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
server_reset_query = DISCARD ALL
default_pool_size = 20
max_client_conn = 100
ignore_startup_parameters = extra_float_digits
